<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>种植园尨译助手</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup-theme-preloader.js"></script>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="brand">
      <div class="brand-icon">
        <img class="icon-light" src="img/icon.png" alt="Icon" />
        <img class="icon-dark" src="img/icon-white.png" alt="Icon White" />
      </div>
      <div>
        <div class="brand-title">种植园尨译助手</div>
        <span class="team-badge">种植园汉化组</span>
      </div>
    </div>
    <button class="refresh-icon-btn" id="btn-refresh-popup" title="刷新数据">
      <svg class="sf-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.5 2v6h-6M2.5 22v-6h6"/>
        <path d="M2 11.5a10 10 0 0 1 18.8-4.3L21.5 8M2.5 16l1 1A10 10 0 0 0 22 12.5"/>
      </svg>
    </button>
  </header>

  <!-- Main Scrollable Area -->
  <main class="main-content">
    <!-- User Card -->
    <div class="user-card" id="user-card-element">
      <div class="user-avatar" id="user-avatar-text">
        <img class="icon-light" src="img/icon.png" alt="Icon" />
        <img class="icon-dark" src="img/icon-white.png" alt="Icon White" />
      </div>
      <div class="user-info">
        <div class="user-name" id="user-name-text">种植园汉化组成员</div>
        <div class="user-status" id="user-status-text">
          <span class="status-dot"></span>已连接 尨译 [moetran.com]
        </div>
      </div>
    </div>

    <!-- Stats Overview Grid -->
    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-label">参与项目总数</span>
        <span class="stat-number" id="stat-total-projects">--</span>
        <span class="stat-sub" id="stat-plantation-projects">种植园 -- 个</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">翻译句子数</span>
        <span class="stat-number stat-blue" id="stat-translated-count">--</span>
        <span class="stat-sub" id="stat-translation-rate">完成率 --%</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">校对句子数</span>
        <span class="stat-number stat-purple" id="stat-checked-count">--</span>
        <span class="stat-sub" id="stat-checked-rate">完成率 --%</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">状态分布</span>
        <span class="stat-number stat-green" id="stat-active-projects">--</span>
        <span class="stat-sub" id="stat-finished-projects">进行中 / 已完成 --</span>
      </div>
    </div>

    <!-- Project Breakdown Section -->
    <div class="section-header">
      <span class="section-title">最近20个项目进度</span>
      <span class="last-sync-label" id="last-sync-label">全量自动同步</span>
    </div>

    <div class="project-list" id="project-list-container">
      <div class="loading-state">
        <svg class="sf-icon sf-spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83" stroke-linecap="round"/>
        </svg>
        <span>加载数据中...</span>
      </div>
    </div>

    <!-- Feishu Bitable Settings Section -->
    <div class="diagnostic-wrapper" style="margin-top: 10px;">
      <button class="diagnostic-toggle-btn" id="btn-toggle-feishu-config">
        <span class="btn-inner">
          <svg class="sf-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
          </svg>
          飞书多维表格同步配置
        </span>
        <span id="feishu-config-arrow" class="arrow-icon">
          <svg class="sf-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </span>
      </button>

      <div class="diagnostic-panel" id="feishu-config-box" style="display: none; flex-direction: column; gap: 10px; padding: 12px;">
        <!-- Config field status grid -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px;">
          <div class="feishu-field-status">
            <span class="feishu-field-label">App ID</span>
            <span class="feishu-field-badge" id="feishu-status-appid">未设置</span>
          </div>
          <div class="feishu-field-status">
            <span class="feishu-field-label">App Secret</span>
            <span class="feishu-field-badge" id="feishu-status-appsecret">未设置</span>
          </div>
          <div class="feishu-field-status">
            <span class="feishu-field-label">App Token</span>
            <span class="feishu-field-badge" id="feishu-status-apptoken">未设置</span>
          </div>
          <div class="feishu-field-status">
            <span class="feishu-field-label">Table ID</span>
            <span class="feishu-field-badge" id="feishu-status-tableid">未设置</span>
          </div>
        </div>

        <!-- Hidden file input -->
        <input type="file" id="feishu-cfg-file-input" accept=".json" style="display: none;" />

        <!-- Action buttons -->
        <div style="display: flex; gap: 8px; margin-top: 2px;">
          <button class="btn btn-primary" id="btn-import-feishu-cfg" style="flex: 2; padding: 6px 12px; font-size: 12px;">
            <svg class="sf-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            导入配置文件
          </button>
          <button class="btn btn-secondary" id="btn-bulk-sync-plantation" style="flex: 2; padding: 6px 12px; font-size: 12px;" title="抓取种植园全量项目导入飞书">初始全量导入</button>
          <button class="btn btn-danger" id="btn-clear-feishu-cfg" style="flex: 1; padding: 6px 8px; font-size: 12px;" title="清除全部飞书凭证配置">清除</button>
        </div>

        <div id="feishu-cfg-status" style="font-size: 11px; opacity: 0.7; text-align: center;"></div>
      </div>
    </div>

    <!-- Diagnostic Panel Section -->
    <div class="diagnostic-wrapper">
      <button class="diagnostic-toggle-btn" id="btn-toggle-diagnostic">
        <span class="btn-inner">
          <svg class="sf-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
          </svg>
          运行分步诊断测试
        </span>
        <span id="diagnostic-arrow" class="arrow-icon">
          <svg class="sf-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </span>
      </button>

      <div class="diagnostic-panel" id="diagnostic-panel-box" style="display: none;">
        <div class="diagnostic-header">
          <span>系统连通性与分步断言</span>
          <button class="diagnostic-run-btn" id="btn-run-diagnostic">
            <svg class="sf-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
            立即运行全套测试
          </button>
        </div>
        <div class="diagnostic-log" id="diagnostic-log-container">
          <div class="diag-info">点击“立即运行全套测试”开始诊断 Token、API 和数据解析...</div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer Actions -->
  <footer class="footer">
    <button class="btn btn-secondary" id="btn-sync-feishu" title="一次性抓取最近 10 个项目进度写入飞书">
      <svg class="sf-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="17 8 12 3 7 8"></polyline>
        <line x1="12" y1="3" x2="12" y2="15"></line>
      </svg>
      <span id="sync-feishu-btn-text">更新进度</span>
    </button>
    <button class="btn btn-primary" id="btn-copy-report">
      <svg class="sf-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
        <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
        <path d="M9 12h6"></path>
        <path d="M9 16h6"></path>
      </svg>
      <span id="copy-btn-text">一键工作简报</span>
    </button>
  </footer>

  <script src="popup.js" type="module"></script>
</body>
</html>
